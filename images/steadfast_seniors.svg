<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" style="background-color: #FDFBF7;">
  <g transform="translate(50, 80)" fill="none" stroke="#1D3461" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Mountain -->
    <path d="M 0 100 L 70 30 L 140 100" />
    <!-- Right Mountain -->
    <path d="M 100 100 L 170 30 L 250 110" />
